<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ 'Edit Job' if editing else 'Submit a Job' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">{{ 'Edit Job Details' if editing else 'Submit a Job' }}</h2>
    <form action="{{ url_for('edit_job', job_id=job_id) if editing else url_for('submit') }}" method="POST" enctype="multipart/form-data" class="card shadow p-4 bg-white">
      <div class="mb-3">
        <label class="form-label">Job Position</label>
        <input type="text" name="position" value="{{ job.position if editing else '' }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Job Description</label>
        <textarea name="description" class="form-control" rows="3" required>{{ job.description if editing else '' }}</textarea>
      </div>
      <div class="row">
        <div class="mb-3 col-md-6">
          <label class="form-label">Posting Date</label>
          <input type="date" name="posting_date" value="{{ job.posting_date if editing else '' }}" class="form-control" required>
        </div>
        <div class="mb-3 col-md-6">
          <label class="form-label">Last Date to Apply</label>
          <input type="date" name="last_date" value="{{ job.last_date if editing else '' }}" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Point of Contact</label>
        <input type="text" name="contact" value="{{ job.contact if editing else '' }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Source of Applying</label>
        <input type="text" name="source" value="{{ job.source if editing else '' }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date of Application</label>
        <input type="date" name="application_date" value="{{ job.application_date if editing else '' }}" class="form-control" required>
      </div>
      {% if not editing %}
      <div class="mb-3">
        <label class="form-label">Upload Resume (PDF)</label>
        <input type="file" name="resume" accept="application/pdf" class="form-control" required>
      </div>
      {% endif %}
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary">{{ 'Update' if editing else 'Submit' }}</button>
        <a href="/view" class="btn btn-outline-secondary">View Jobs</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
